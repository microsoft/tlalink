name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    name: Linux build and native tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Read shared native prerequisite pins
        id: toolchain
        run: |
          . .\scripts\Native-Toolchain.ps1
          $pin = Get-TlaLinkNativeToolchain $PWD
          "dotnet8=$($pin.dotnet.sdk8)" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          dotnet-version: ${{ steps.toolchain.outputs.dotnet8 }}

      - name: Restore and build
        run: |
          & .\tests\Toolchain.Tests.ps1
          dotnet restore TlaLink.sln --configfile NuGet.Config --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build TlaLink.sln --configuration Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run backend-independent controls
        run: |
          $reports = Join-Path $env:RUNNER_TEMP 'tlalink-ci'
          $null = New-Item -ItemType Directory -Path $reports -Force
          $tests = Join-Path $PWD 'tests\TlaLink.Tests\bin\Release\net10.0\TlaLink.Tests.dll'
          dotnet $tests . --core 2>&1 | Tee-Object -FilePath (Join-Path $reports 'core.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pack and smoke-test the installed .NET tool
        run: |
          dotnet pack .\src\tlalink\TlaLink.csproj --configuration Release --no-build --output .\.tools\packages --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = @(Get-ChildItem -LiteralPath .\.tools\packages -Filter '*.nupkg')
          if ($package.Count -ne 1) { throw 'Expected one freshly packed TlaLink tool.' }
          & .\tests\ToolPackage.Tests.ps1 -Package $package[0].FullName

      - name: Restore pinned prebuilt tools and check offline idempotence
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = Join-Path $PWD 'src\tlalink\bin\Release\net10.0\TlaLink.dll'
          $cache = Join-Path $PWD '.tools'
          $restored = @(dotnet $cli toolchain restore --directory $cache --timeout 600)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = ($restored -join "`n") | ConvertFrom-Json
          $restored | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'tlalink-ci\restore.json')
          $repeated = @(dotnet $cli toolchain restore --directory $cache --offline true)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checked = ($repeated -join "`n") | ConvertFrom-Json
          if ($checked.tools.Count -ne 5 -or @($checked.tools | Where-Object status -ne 'current').Count) {
            throw 'Repeated offline restore must leave all five installations current.'
          }
          $tools = @{}
          foreach ($tool in $result.tools) { $tools[$tool.id] = $tool }
          "TLALINK_JAVA_HOME=$($tools.java.directory)" >> $env:GITHUB_ENV
          "TLALINK_TLA_JAR=$($tools.tlc.entrypoint)" >> $env:GITHUB_ENV
          "TLALINK_DAFNY=$($tools.dafny.entrypoint)" >> $env:GITHUB_ENV
          "TLALINK_APALACHE_JAR=$($tools.apalache.entrypoint)" >> $env:GITHUB_ENV
          "TLALINK_P_COMPILER=$($tools.p.entrypoint)" >> $env:GITHUB_ENV

      - name: Run complete console suite
        run: |
          $reports = Join-Path $env:RUNNER_TEMP 'tlalink-ci'
          $tests = Join-Path $PWD 'tests\TlaLink.Tests\bin\Release\net10.0\TlaLink.Tests.dll'
          dotnet $tests . (Join-Path $reports 'results.json') 2>&1 |
            Tee-Object -FilePath (Join-Path $reports 'native.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test installed native bridge and instrumentation
        run: |
          $package = @(Get-ChildItem -LiteralPath .\.tools\packages -Filter '*.nupkg')
          if ($package.Count -ne 1) { throw 'Expected one freshly packed TlaLink tool.' }
          & .\tests\ToolPackage.Tests.ps1 -Package $package[0].FullName `
            -Jar $env:TLALINK_TLA_JAR -JavaHome $env:TLALINK_JAVA_HOME

      - name: Upload tool package
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: tlalink-tool-package
          path: .tools/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: linux-test-results
          path: ${{ runner.temp }}/tlalink-ci
          if-no-files-found: warn
          retention-days: 7
